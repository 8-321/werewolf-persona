<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>狼人杀人格图鉴 · 你上桌，是哪一种身份？</title>
<meta name="description" content="36 道核心题，难分胜负时最多加 6 道校准题，约 4 分钟测出你在牌桌上的身份人格：悍跳狼、倒钩狼、深水狼、预言家、守卫、整活玩家……没玩过狼人杀也能测。">
<meta name="theme-color" content="#14120E">
<meta property="og:title" content="狼人杀人格图鉴 · 你上桌，是哪一种身份？">
<meta property="og:description" content="36 道核心题 + 最多 6 道校准题，约 4 分钟，12 种身份。没玩过狼人杀也能测。">
<meta property="og:image" content="https://8-321.github.io/werewolf-persona/og.png">
<meta property="og:url" content="https://8-321.github.io/werewolf-persona/">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2314120E'/%3E%3Cpath d='M13.5 2.5 6.2 13.4h4.6L10 21.5l7.8-11h-4.9l.6-8z' fill='none' stroke='%23D9B860' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ============ 01 封面 ============ -->
  <section class="screen cover active" id="screen-cover">
    <div class="wrap-pad">
      <div class="brand">
        <span class="l"><span class="mark" aria-hidden="true">盒</span><span id="cBrand">人格盲盒实验室</span></span>
        <button class="about-btn" type="button" id="btnAbout" data-act="about" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10.6v6.2M12 7.6v.1"/></svg>
          <span>关于</span>
        </button>
      </div>

      <div class="cover-grid">
        <div class="cover-main">
          <div class="eyebrow" id="cEyebrow"></div>
          <h1 id="cTitle"></h1>
          <p class="sub" id="cSub"></p>
          <p class="lede" id="cLede"></p>
        </div>
        <div class="cover-side" aria-hidden="true">
          <div class="fan">
            <div class="moon"></div>
            <div class="fc f1"><span class="emb" id="fcBrew"></span><span class="nb">BREW</span></div>
            <div class="fc f3"><span class="emb" id="fcDive"></span><span class="nb">DIVE</span></div>
            <div class="fc f2"><span class="emb" id="fcHype"></span><span class="nb">HYPE</span></div>
          </div>
        </div>
      </div>

      <ul class="metas" id="cMetas"></ul>
      <p class="hint" id="cHint"></p>
      <div class="cta" id="cCta"></div>
      <p class="cnt" id="cCount"></p>
    </div>
  </section>

  <!-- ============ 02 答题（核心 36 + 校准 6） ============ -->
  <section class="screen" id="screen-quiz">
    <div class="wrap-pad">
      <header class="qhead">
        <button class="icirc" type="button" id="btnBack" data-act="back" aria-label="上一题">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
        <div class="qmeta">
          <span class="qch" id="qChapter"></span>
          <span class="qnum"><b id="qNow">01</b><span class="slash">/</span><span id="qTotal">36</span></span>
        </div>
      </header>
      <div class="prog" id="progBar" role="progressbar" aria-valuemin="0" aria-valuemax="36" aria-valuenow="1" aria-label="答题进度"><i id="progFill"></i></div>
      <p class="sr" id="qLive" aria-live="polite" role="status"></p>
      <div id="qbox"></div>
      <footer class="qfoot"><span class="tip" id="qTip"></span></footer>
    </div>
  </section>

  <!-- ============ 03 章节过场 ============ -->
  <section class="screen" id="screen-chapter" data-act="ch-skip">
    <div class="chapter-card">
      <div class="ch-no" id="chNo"></div>
      <h2 id="chName"></h2>
      <p id="chDesc"></p>
      <button class="ch-skip" type="button" data-act="ch-skip">跳过</button>
    </div>
  </section>

  <!-- ============ 04 校准引导页 ============ -->
  <section class="screen" id="screen-calib">
    <div class="calib-card">
      <div class="calib-tag" id="calibKicker"></div>
      <h2 id="calibTitle"></h2>
      <p class="calib-lead" id="calibIntro"></p>
      <p class="calib-note" id="calibNote"></p>
      <button class="btn gold" type="button" id="calibStart" data-act="calib-start">开始加赛</button>
    </div>
  </section>

  <!-- ============ 05 生成中 ============ -->
  <section class="screen" id="screen-reveal">
    <div class="gen">
      <div class="halo"></div>
      <div class="gc"><span class="ring"></span><span class="emb" id="genEmb"></span></div>
      <h2 id="genTitle"></h2>
      <div class="rotor" id="rotor"></div>
    </div>
  </section>

  <!-- ============ 06 结果页 ============ -->
  <section class="screen" id="screen-result">
    <div class="wrap-pad">
      <div class="rhead sb" style="--l:0ms;--d:340ms">
        <button class="icirc" type="button" id="rBack" data-act="home" aria-label="返回封面">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
        <button class="icirc gold" type="button" id="rShare" data-act="share" aria-label="分享">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5V4.2M8.2 7.8 12 4l3.8 3.8M5.5 13.5v5.3h13v-5.3"/></svg>
        </button>
      </div>
      <div class="eyebrow2 sb" style="--l:70ms;--d:300ms" id="rEyebrow"></div>

      <div class="idcard sb" style="--l:110ms;--d:380ms">
        <div class="idtop">
          <div class="badge sb sb-scale" id="badgeWrap" style="--l:170ms;--d:420ms;--e:var(--ease-b)"></div>
          <div class="idname sb" id="rName" style="--l:290ms;--d:320ms"></div>
          <div class="idcode sb" id="rCode" style="--l:370ms;--d:300ms"></div>
          <div class="idmatch sb" id="rMatch" style="--l:440ms;--d:300ms"></div>
          <div class="idtags sb" id="rTags" style="--l:500ms;--d:240ms"></div>
        </div>
      </div>

      <div class="quote sb" id="rQuote" style="--l:580ms;--d:460ms"></div>
      <div class="rar sb" id="rRar" style="--l:680ms;--d:380ms">
        <span class="rk" id="rRank"></span>
        <div class="track"><div class="fill" id="rarFill"></div></div>
        <span class="pc" id="rPct"></span>
      </div>

      <div class="sect">
        <h3 class="sb" id="rWhy" style="--l:780ms;--d:360ms"></h3>
        <div class="sb" id="rParas" style="--l:840ms;--d:400ms"></div>
        <div class="weak sb" id="rWeak" style="--l:940ms;--d:400ms"></div>
      </div>

      <div class="sect">
        <h3 class="sb" id="rDimsTitle" style="--l:1000ms;--d:360ms"></h3>
        <div class="dims sb" id="rDims" style="--l:1020ms;--d:1ms"></div>
        <div class="sb" style="--l:1460ms;--d:1ms"><div class="camp" id="rCamp"></div></div>
        <div class="camplb sb" id="rCampLb" style="--l:1520ms;--d:300ms"></div>
      </div>

      <div class="sect">
        <h3 class="sb" id="rOtherTitle" style="--l:1600ms;--d:360ms"></h3>
        <div class="duo sb" id="rDuo" style="--l:1660ms;--d:340ms"></div>
      </div>

      <div class="sect">
        <h3 class="sb" id="rSocialTitle" style="--l:1740ms;--d:360ms"></h3>
        <div class="social sb" id="rSocial" style="--l:1800ms;--d:340ms"></div>
      </div>

      <div class="sect">
        <h3 class="sb" id="rContrastTitle" style="--l:1880ms;--d:360ms"></h3>
        <div class="contrast sb" id="rContrast" style="--l:1940ms;--d:400ms"></div>
      </div>

      <div class="sect">
        <h3 class="sb" id="rHookTitle" style="--l:2020ms;--d:360ms"></h3>
        <div class="hook sb" id="rHook" style="--l:2080ms;--d:340ms"></div>
      </div>

      <div class="sect">
        <h3 class="sb" id="rCapsTitle" style="--l:2160ms;--d:360ms"></h3>
        <div class="caps sb" id="rCaps" style="--l:2220ms;--d:340ms"></div>
      </div>

      <div class="racts sb" style="--l:2300ms;--d:340ms">
        <button class="btn gold" type="button" id="btnSave" data-act="save">保存结果卡</button>
        <div class="racts-row">
          <button class="btn ghost" type="button" id="btnShare" data-act="share">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5V4.2M8.2 7.8 12 4l3.8 3.8M5.5 13.5v5.3h13v-5.3"/></svg>
            <span id="btnShareText">原生分享</span>
          </button>
          <button class="btn ghost" type="button" id="btnCopy" data-act="copy">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.6 14.4 14.4 9.6M11.5 6.6l1.9-1.9a3.4 3.4 0 0 1 4.8 4.8l-1.9 1.9M12.5 17.4l-1.9 1.9a3.4 3.4 0 0 1-4.8-4.8l1.9-1.9"/></svg>
            <span>复制链接</span>
          </button>
        </div>
        <button class="btn ghost" type="button" id="btnRetest" data-act="retest">再测一次</button>
        <button class="duo-entry" type="button" id="btnDuo" data-act="duo"></button>
      </div>

      <a class="more sb" id="crossLink" target="_blank" rel="noopener" style="--l:2380ms;--d:340ms"></a>
      <div class="disc sb" id="rDisc" style="--l:2440ms;--d:340ms"></div>
    </div>
  </section>

  <!-- 结果卡弹层 -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="结果卡预览" hidden>
    <img id="shareImg" alt="我的狼人杀人格结果卡">
    <div class="hint2" id="shareHint"></div>
    <div class="orow">
      <button class="btn gold" type="button" id="overlaySave" data-act="overlay-save">保存图片</button>
      <button class="btn ghost" type="button" id="overlayClose" data-act="overlay-close">返回</button>
    </div>
  </div>

  <!-- 关于 / 免责 -->
  <div class="modal" id="aboutModal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" hidden>
    <div class="modal-box">
      <h3 id="aboutTitle">关于与免责</h3>
      <div class="modal-body" id="aboutBody"></div>
      <button class="btn ghost" type="button" id="aboutClose" data-act="close-about">关闭</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="shareCanvas" aria-hidden="true"></canvas>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
